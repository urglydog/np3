# Mẫu triển khai trên một VPS Hetzner. Supabase dùng bản đám mây (Auth + Postgres), không tự host.
# Chưa chạy thử với app thật (app chưa tồn tại): kiểm tra tên thư mục build và biến môi trường khi dựng dự án.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?cần đặt APP_DOMAIN trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # giữ chứng chỉ HTTPS giữa các lần khởi động lại
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file: .env
    # Worker gửi nhắc việc: đọc bảng reminders mỗi phút, gửi Web Push, ghi kết quả. Không mở cổng nào ra ngoài.

volumes:
  caddy_data:
  caddy_config:
